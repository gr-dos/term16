name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches the pinned libc16 release (scripts/fetch-libc16) and
      # the Open Watcom snapshot it names; the snapshot is cached per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      # lrzsz provides sz, the ZMODEM sender the download tests talk to.
      - name: Install DOSBox-X and lrzsz
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x lrzsz

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Test on a slow 8086
        run: |
          printf '#!/bin/sh\nexec dosbox-x -set "cputype=8086" -set "core=normal" -set "cpu cycles=fixed 300" "$@"\n' > build/dosbox-xt
          chmod +x build/dosbox-xt
          DOSBOX=$PWD/build/dosbox-xt ZBAUD=19200 sh tests/run.sh term16.exe build/t16test.exe
